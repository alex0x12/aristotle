<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аристотель</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="vign" aria-hidden="true"></div>
<div class="layer">
  <div class="meander" aria-hidden="true"></div>
  <header class="frieze-wrap">
    <div class="frieze" aria-hidden="true"></div>
    <div class="over">
      <a class="logo" href="#/">ΑΡΙΣΤΟΤΕΛΗΣ<small>БЕСЕДЫ ПО КОРПУСУ ПОДЛИННЫХ СОЧИНЕНИЙ</small></a>
      <div class="meter">
        <select id="profile" title="Профиль"></select>
        <span id="ctx-label">контекст —</span><span class="bar" id="ctx-bar"><i></i></span><br>
        <span id="usage-line"></span>
      </div>
    </div>
  </header>
  <div class="meander" aria-hidden="true"></div>
  <div class="body">
    <nav class="panel side">
      <div class="medal" aria-hidden="true"></div>
      <div class="cap">384–322 ДО Н. Э.</div>
      <h4>БЕСЕДЫ</h4>
      <div class="convs" id="convs"></div>
      <button class="newc" id="new-conv" type="button">НОВАЯ БЕСЕДА</button>
      <div class="side-links"><a href="#/library">БИБЛИОТЕКА</a> · <a href="#/settings">НАСТРОЙКИ</a></div>
    </nav>
    <main class="panel center" id="center"></main>
    <aside class="panel src" id="src" hidden>
      <div class="vase" aria-hidden="true"></div>
      <div class="in" id="src-in"></div>
    </aside>
  </div>
</div>
</body>
</html>
